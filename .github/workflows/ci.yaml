name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Ensure only one workflow instance runs at a time. For branches other than the
# default branch, cancel the pending jobs in the group. For the default branch,
# queue them up. This avoids cancelling jobs that are in the middle of deploying
# to production.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: replicate/actions/.github/workflows/buildx.yml@main
    with:
      image: valkey
      context: docker-images/valkey

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: luizm/action-sh-checker@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHFMT_OPTS: -i 4
        with:
          sh_checker_comment: true

      - uses: azure/setup-helm@v4

      - uses: astral-sh/setup-uv@v6

      - uses: helm/chart-testing-action@v2

      - run: uv run ct lint --all --validate-maintainers=false --chart-dirs .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: astral-sh/setup-uv@v6

      - uses: helm/chart-testing-action@v2

      - uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - uses: docker/setup-buildx-action@v3

      - run: script/build

      - run: script/test
