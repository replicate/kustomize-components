apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instead of using helmCharts, we'll directly include the template resources
resources:
- templates/valkey-server/certificate.yaml
- templates/valkey-server/service-headless.yaml
- templates/valkey-server/statefulset.yaml
- templates/sentinel/certificate.yaml
- templates/sentinel/service-headless.yaml
- templates/sentinel/service.yaml
- templates/sentinel/statefulset.yaml

# Configuration for the templates
vars:
- name: VALKEY_VALUES
  objref:
    kind: ConfigMap
    name: valkey-values
    apiVersion: v1
  fieldref:
    fieldpath: data.values\.yaml

transformers:
- |-
  apiVersion: builtin
  kind: ValueTransformerPlugin
  metadata:
    name: ValueTransformer
  argsOneLiner: true
  values:
    valuesData: $(VALKEY_VALUES)