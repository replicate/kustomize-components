global:
  namespace: valkey

sentinel:
  image: valkey:replicate-latest
  storage:
    size: 100Mi
  replicas: 3
  password_secret: valkey-sentinel-password

valkey:
  image: valkey:replicate-latest
  servers:
  - name: testme
    password_secret: valkey-server-omg-password
    replicas: 2
    storage:
      size: 200Mi
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
  - name: omg
    replicas: 2
    down_after_milliseconds: 3000
    failover_timeout: 10000
    parallel_syncs: 1
    password_secret: valkey-server-omg-password
    storage:
      size: 200Mi
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
