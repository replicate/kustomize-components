apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel-headless-{{ .Release.Name }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: valkey-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
