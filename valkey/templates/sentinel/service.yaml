apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: valkey-sentinel
    app.kubernetes.io/component: valkey-sentinel
    app.kubernetes.io/part-of: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
  type: ClusterIP