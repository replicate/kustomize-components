apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-sentinel
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: valkey-sentinel
    app.kubernetes.io/component: valkey-sentinel
    app.kubernetes.io/part-of: valkey
spec:
  serviceName: valkey-sentinel-headless
  replicas: {{ default 3 .Values.sentinel.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-sentinel
    spec:
      securityContext:
        fsGroup: 1000

      {{- if and (hasKey $.Values.global "topology_spread_constraints") ($.Values.global.topology_spread_constraints.enabled) }}
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-sentinel
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      {{- end }}
      initContainers:
      - name: init-sentinel
        image: alpine:latest
        command: ["sh", "-c"]
        args:
        - |
          if [ ! -f /data/sentinel.conf ]; then
            echo "sentinel resolve-hostnames yes" >> /data/sentinel.conf
            echo "sentinel announce-hostnames yes" >> /data/sentinel.conf
            #echo "sentinel requirepass {{ .Values.sentinel.password }}" >> /data/sentinel.conf
            chown 999:1000 /data/sentinel.conf
          fi

        volumeMounts:
          - name: data
            mountPath: /data

      containers:
      - name: valkey-sentinel
        image: valkey/valkey:8.1-alpine
        imagePullPolicy: IfNotPresent

        args: 
        - /usr/local/bin/valkey-sentinel
        - /data/sentinel.conf

        securityContext:
          runAsUser: 999
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        volumeMounts:
        - name: data
          mountPath: /data

        resources:
          requests:
            cpu: 10m
            memory: 32Mi

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.sentinel.storage.size }}
