{{- $required_sentinels := int .Values.sentinel.replicas }}
{{- range $_index, $server := .Values.valkey.servers }}
{{- $service_name := printf "valkey-server-%s" $server.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-{{ $server.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey-{{ $server.name }}
    app.kubernetes.io/component: valkey-server
    app.kubernetes.io/part-of: valkey
spec:
  serviceName: {{ $service_name }}
  replicas: {{ default 2 $server.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: valkey-{{ $server.name }}
      app.kubernetes.io/component: valkey-server
      app.kubernetes.io/part-of: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: valkey-{{ $server.name }}
        app.kubernetes.io/component: valkey-server
        app.kubernetes.io/part-of: valkey
    spec:
      securityContext:
        fsGroup: 1000

      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: valkey-{{ $server.name }}
              app.kubernetes.io/component: valkey-server
              app.kubernetes.io/part-of: valkey
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

      initContainers:
      - name: valkey-configuration
        image: alpine:latest
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["sh", "-c"]
        args:
          - |
            echo "dir /data/" >> /opt/valkey/etc/master.conf
            echo "rename-command FLUSHDB \"\"" >> /opt/valkey/etc/master.conf
            echo "rename-command FLUSHALL \"\"" >> /opt/valkey/etc/master.conf

            echo "appendonly no" >> /opt/valkey/etc/valkey.conf
            echo "save 3600 1 300 100 60 10000" >> /opt/valkey/etc/valkey.conf
            echo "maxmemory-policy allkeys-lru" >> /opt/valkey/etc/valkey.conf
            echo "replica-announce-ip ${POD_NAME}.valkey-server-{{ $server.name }}.valkey.svc.cluster.local" >> /opt/valkey/etc/valkey.conf

        volumeMounts:
          - name: etc
            mountPath: /opt/valkey/etc

      containers:
      - name: valkey-server
        image: {{ default "valkey/valkey:8.1-alpine" $.Values.valkey.image }}
        imagePullPolicy: IfNotPresent

        args:
        - --include /opt/valkey/etc/master.conf
        - --include /opt/valkey/etc/valkey.conf

        volumeMounts:
          - name: data
            mountPath: /data
          - name: etc
            mountPath: /opt/valkey/etc

        resources:
          {{- toYaml $server.resources | nindent 12 }}

        securityContext:
          runAsUser: 999
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VALKEY_NODE_TYPE
          value: "valkey"
        - name: VALKEY_NAME
          value: {{ $server.name }}
        - name: VALKEY_SERVICE_NAME
          value: {{ $service_name }}
        - name: VALKEY_SENTINEL_SERVICE_SRV
          value: _sentinel._tcp.valkey-sentinel.valkey.svc.cluster.local
        - name: VALKEY_REQUIRED_SENTINELS
          value: "{{ int $required_sentinels }}"
        - name: VALKEY_DOWN_AFTER_MILLISECONDS
          value: "{{ default 3000 $server.down_after_milliseconds | int }}"
        - name: VALKEY_FAILOVER_TIMEOUT
          value: "{{ default 10000 $server.failover_timeout | int }}"
        - name: VALKEY_PARALLEL_SYNCS
          value: "{{ default 1 $server.parallel_syncs | int }}"
        {{- if and (hasKey $server "tls") (hasKey $server.tls "enabled") (eq $server.tls.enabled true) }}
        - name: VALKEY_TLS_ENABLED
          value: "true"
        {{- end }}

        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /opt/valkey/etc/ready"]
  
      volumes:
      - name: etc
        emptyDir: {}

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $server.storage.size }}
{{- end }}
